# Dependabot for actions, Python tools and npm packages (7-day cooldown). gitleaks,
# actionlint and the Roundcube release are pinned by sha256 and bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    labels: [dependencies]
    groups:
      dev-tools:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      css-compiler:
        patterns: ["less", "clean-css"]
      palette-toolchain:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "vite", "@vitejs/*", "vitest",
                   "jsdom", "@testing-library/*", "typescript"]
