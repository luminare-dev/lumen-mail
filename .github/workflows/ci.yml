# Caller: lint, tests and the full-history secret scan on every pull request and push to main,
# plus two project jobs:
#   node     the command palette and the gallery: npm ci, type check, Vitest, node --test, the
#            palette bundle (with its size and API check) and the gallery, kept as artifacts;
#   package  the skin: a compiler-only install (like a server), the palette bundle from the node
#            job, the real LESS compile against the Elastic skin of a pinned Roundcube release,
#            and the release package built from it (kept as the "lumen-package" artifact).
# Required checks for the main ruleset: "ci / lint-test", "node", "package" and "secrets / gitleaks".
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Superseded pull request runs are cancelled. Each commit on main gets its own group, so it
  # always keeps its CI result (a shared group would still drop all but the newest pending run).
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    permissions:
      contents: read

  secrets:
    uses: ./.github/workflows/reusable-gitleaks.yml
    permissions:
      contents: read

  node:
    name: node
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the locked packages (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check (palette and gallery, TypeScript)
        run: npm run typecheck

      - name: Unit tests (Vitest, jsdom, Testing Library)
        run: npm test

      - name: Script tests (node --test, no dependencies)
        run: npm run test:js

      - name: Build the command palette (size and API check included)
        run: npm run build:palette

      - name: Build the gallery (tokens and palette; no skin in CI)
        run: npm run build:gallery

      - name: Keep the palette bundle (the package job builds the skin with it)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: palette
          path: palette/dist/lumen-palette.js
          if-no-files-found: error
          retention-days: 14

      - name: Keep the gallery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery
          path: gallery/dist
          if-no-files-found: error
          retention-days: 14

  package:
    name: package
    needs: node
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the locked compiler only, as on a server (no install scripts)
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Take the palette bundle the node job built and tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: palette
          path: palette/dist

      # The official release archive (github.com/roundcube/roundcubemail); version and sha256 are
      # pinned once, in scripts/package.py (ROUNDCUBE_VERSION, ROUNDCUBE_SHA256).
      - name: Fetch Roundcube (sha256-pinned)
        run: python3 -I scripts/package.py fetch --dest "$RUNNER_TEMP/roundcube"

      - name: Build and verify the skin against the release's Elastic
        env:
          LUMEN_MAIL_TEST_ROUNDCUBE: ${{ runner.temp }}/roundcube
          LUMEN_MAIL_TEST_REQUIRE: "1"
        run: python3 -m unittest discover -s tests -p "test_lumen_integration.py" -v

      - name: Release package (tar.gz and zip with SHA256SUMS)
        run: |
          set -euo pipefail
          python3 -I scripts/package.py build --roundcube "$RUNNER_TEMP/roundcube" --out dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-package
          path: dist/
          if-no-files-found: error
          retention-days: 14
