# gitleaks configuration for lumen-mail: the built-in rules, two rules for Roundcube's own
# secrets that the defaults miss (checked against gitleaks 8.30.1, 2026-10-22), and the studio's
# shared rules for game-server and chat secrets, which every Luminare Development repository
# keeps so that all of them scan for the same things.
# Run locally:  gitleaks git --redact --config .gitleaks.toml .
title = "lumen-mail gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "roundcube-des-key"
description = "Roundcube des_key set to a literal value (it encrypts the IMAP password in the session)"
regex = '''\$config\[\s*['"]des_key['"]\s*\]\s*=\s*['"]([^'"]{12,})['"]'''
secretGroup = 1
keywords = ["des_key"]

  [[rules.allowlists]]
  description = "documentation placeholders, Roundcube's sample value and the tests' marker value"
  regexes = ['''(?i)example|placeholder|changeme''', '''^rcmail-!24ByteDESkey\*Str$''', '''^SECRET-XYZ-\d+$''']

[[rules]]
id = "dsn-credentials"
description = "database password inside a DSN (Roundcube's db_dsnw, db_dsnr and similar)"
regex = '''\b(?:mysqli?|pgsql|postgres(?:ql)?|sqlsrv|mssql|sqlite)://[^:\s/'"@]+:([^@\s'"]{6,})@'''
secretGroup = 1
keywords = ["://"]

  [[rules.allowlists]]
  description = "documentation placeholders and templated values"
  regexes = ['''(?i)^(pass(word)?|secret|changeme|example|placeholder)$''', '''^\$\{?[A-Za-z_]''', '''^\{\{.*\}\}$''',
             '''^\{[A-Za-z_][^{}]*\}$''']

[[rules]]
id = "cfx-server-key"
description = "FXServer license key (cfxk_...); the platform also scans public repositories for these"
regex = '''\b(cfxk_[A-Za-z0-9]{10,40}_[A-Za-z0-9]{4,12})\b'''
secretGroup = 1
keywords = ["cfxk_"]

  [[rules.allowlists]]
  description = "documentation placeholder made of x characters"
  regexes = ['''^cfxk_x+_x+$''']

[[rules]]
id = "fxserver-license-key-setting"
description = "sv_licenseKey set to a literal value in a server config"
regex = '''(?i)\bsv_licenseKey\s+["']?([A-Za-z0-9_]{16,64})["']?'''
secretGroup = 1
keywords = ["sv_licensekey"]

  [[rules.allowlists]]
  description = "templated values (Ansible/Jinja, environment variables, convar references)"
  regexTarget = "line"
  regexes = ['''\{\{.*\}\}''', '''\$\{?[A-Za-z_]''', '''changeme''']

  [[rules.allowlists]]
  description = "documentation placeholders (YOUR_..., example, placeholder, the x-placeholder key)"
  regexes = ['''(?i)^your[_-]''', '''(?i)example|placeholder''', '''^cfxk_x+_x+$''']

[[rules]]
id = "txadmin-api-token"
description = "TXHOST_API_TOKEN set to a literal value"
regex = '''\bTXHOST_API_TOKEN\s*[=:]\s*["']?([A-Za-z0-9_-]{16,48})["']?'''
secretGroup = 1
keywords = ["txhost_api_token"]

  [[rules.allowlists]]
  description = "templated values and the documented 'disabled' value"
  regexTarget = "line"
  regexes = ['''\{\{.*\}\}''', '''\$\{?[A-Za-z_]''', '''(?i)=\s*["']?disabled''']

  [[rules.allowlists]]
  description = "documentation placeholders (your-..., example, placeholder)"
  regexes = ['''(?i)^your[_-]''', '''(?i)example|placeholder''']

[[rules]]
id = "discord-webhook-url"
description = "Discord webhook URL (anyone with the URL can post to the channel)"
regex = '''https://(?:(?:canary|ptb)\.)?discord(?:app)?\.com/api/webhooks/[0-9]{17,20}/([A-Za-z0-9_-]{60,80})'''
secretGroup = 1
keywords = ["discord.com/api/webhooks", "discordapp.com/api/webhooks"]
